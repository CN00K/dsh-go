          PYEOF
          # Sanity: the two entry points the iOS worker needs must exist.
          test -f engine-build/stage/opt/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
          test -f engine-build/stage/opt/dsh/vendor/pnpm/dist/pnpm.mjs
          test -d engine-build/stage/opt/dsh/node_modules/@deepseek-ai/node-addon-system/lib
          echo "engine stage OK"

      - name: Assemble NativeNodeArtifacts (NodeMobile + engine)
        script: |
          set -euo pipefail
          # Same pinned NodeMobile inputs as runtime/native-node/prepare-ios.sh,
          # but the payload archive (and its SHA256 check) is skipped: the
          # engine tree was rebuilt from source in the previous steps.
          version=24.20.0-0
          stage=engine-build/stage
          output=app/ios/NativeNodeArtifacts
          mkdir -p "$stage"
          curl --fail --location --retry 2 \
            "https://github.com/digidem/nodejs-mobile/releases/download/v$version/nodejs-mobile-ios-$version.zip" \
            -o "$stage/node-mobile.zip" 2>&1 | tee build-logs/07-nodemobile-download.log
          printf '%s  %s\n' f97c5f368f5982fdc062b0f97d96d7696f94dbaf286fbd0d3c515b596088bca8 "$stage/node-mobile.zip" | shasum -a 256 -c -
          curl --fail --location --retry 2 \
            "https://raw.githubusercontent.com/digidem/nodejs-mobile/v$version/LICENSE" \
            -o "$stage/NodeMobile-LICENSE.txt"
          printf '%s  %s\n' c373dabed995013e091b1908996a69a1647ef19d400e6c1fd4b7fb06d8bc0f66 "$stage/NodeMobile-LICENSE.txt" | shasum -a 256 -c -
          unzip -q "$stage/node-mobile.zip" 'NodeMobile.xcframework/*' -d "$stage"
          mkdir -p "$output"
          rsync -a --delete "$stage/NodeMobile.xcframework/" "$output/NodeMobile.xcframework/"
          rsync -a --delete "$stage/opt/dsh/" "$output/engine/"
          cp "$stage/NodeMobile-LICENSE.txt" "$output/engine/"
          cp runtime/native-node/{supervisor,engine-worker,pnpm-ios,pnpm-worker,ish-bridge}.mjs "$output/engine/"
          # Verify exactly what runtime/native-node/embed-ios.sh will require.
          test -d "$output/NodeMobile.xcframework/ios-arm64/NodeMobile.framework"
          test -f "$output/engine/node_modules/@deepseek-ai/dsh/lib/bin.js"
          test -f "$output/engine/vendor/pnpm/dist/pnpm.mjs"
          test -f "$output/engine/supervisor.mjs"
          test -f "$output/engine/engine-worker.mjs"
          test -f "$output/engine/ish-bridge.mjs"
          echo "NativeNodeArtifacts OK:"
          du -sh "$output"
          find "$output/engine" -maxdepth 2 | head -20

      - name: Build iSH libs
        script: |
          set -euo pipefail
          # Skip guard: rebuild only when the pinned iSH input changed.
          # build-ish.sh itself is idempotent (cached tarball, incremental
          # ninja), but this guard avoids even invoking it on re-runs.
          manifest=app/ios/IShArtifacts/ish-manifest.json
          pinned="$(python3 -c "import json; print(json.load(open('third_party/ish/source.json'))['commit'])")"
          if [ -f "$manifest" ] \
             && [ -f app/ios/IShArtifacts/lib/libish.a ] \
             && [ -f app/ios/IShArtifacts/lib/libish_emu.a ] \
             && [ -f app/ios/IShArtifacts/lib/libfakefs.a ] \
             && [ -f app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf ] \
             && python3 -c "import json,sys; sys.exit(0 if json.load(open('$manifest')).get('ish_commit')=='$pinned' else 1)"; then
            echo "iSH libs already built for commit $pinned, skipping rebuild"
            exit 0
          fi
          bash third_party/ish/build-ish.sh 2>&1 | tee build-logs/07a-build-ish.log
          # The script asserts the VDSO itself; re-assert here so the log
          # shows the check even on a skipped-then-rebuilt run.
          test -s app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf
          file app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf | grep -q "ELF"

      - name: Stage iSH artifacts (rootfs)
        script: |
          set -euo pipefail
          # prepare-rootfs.sh has its own manifest skip guard; this step
          # always runs it (cheap when skipped) and then verifies the
          # contract the prototype App depends on.
          bash third_party/ish/prepare-rootfs.sh 2>&1 | tee build-logs/07b-prepare-rootfs.log
          test -f app/ios/IShArtifacts/alpine-rootfs.zip
          test -f app/ios/IShArtifacts/rootfs-manifest.json
          test -f app/ios/IShArtifacts/lib/libish.a
          test -f app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf
          test -s app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf
          file app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf | grep -q "ELF"
          echo "IShArtifacts OK:"
          du -sh app/ios/IShArtifacts
          python3 -c "import json; m=json.load(open('app/ios/IShArtifacts/rootfs-manifest.json')); print('rootfs zip SHA256:', m['rootfs_zip_sha256'])"
          python3 -c "import json; m=json.load(open('app/ios/IShArtifacts/ish-manifest.json')); print('ish commit:', m['ish_commit'], '| vdso SHA256:', m['vdso']['sha256'])"

      - name: Stage AOT image (stub or recorded)
        script: |
          set -euo pipefail
          # build-aot.sh stages libish_aot.a into app/ios/IShArtifacts/lib/
          # for the Runner target (-force_load). Three modes, in order:
          # local .S (recorded) -> download (aot-manifest.json, SHA256-pinned)
          # -> empty stub (v1: pure gadget interpreter, no images yet).
          # The stub must always exist at link time, or the build fails.
          bash third_party/ish/build-aot.sh 2>&1 | tee build-logs/07c-build-aot.log
          test -f app/ios/IShArtifacts/lib/libish_aot.a
          test -f app/ios/IShArtifacts/aot-manifest.json
          python3 -c "import json; m=json.load(open('app/ios/IShArtifacts/aot-manifest.json')); print('AOT mode:', m['mode'], '| images:', len(m.get('images', [])), '| libish_aot.a SHA256:', m['libish_aot_a']['sha256'][:12])"

      - name: Pod install and build iOS (no codesign)
        script: |
          set -euo pipefail
          cd app
          (cd ios && pod install) 2>&1 | tee ../build-logs/08-pod-install.log
          flutter build ios --no-codesign 2>&1 | tee ../build-logs/09-flutter-build-ios.log
          test -d build/ios/iphoneos/Runner.app
          du -sh build/ios/iphoneos/Runner.app

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          rm -rf Payload dsh-go-unsigned.ipa
          mkdir -p Payload
          # ditto preserves the framework symlinks (needed for re-signing).
          ditto app/build/ios/iphoneos/Runner.app Payload/Runner.app
          find Payload -name .DS_Store -delete || true
          # -y stores symlinks as links (do not dereference them).
          zip -r -y -X dsh-go-unsigned.ipa Payload 2>&1 | tee build-logs/10-package-ipa.log
          ls -lh dsh-go-unsigned.ipa
          # NB: `unzip -l | head` exits 141 (SIGPIPE) under `pipefail` when
          # head closes early, which would fail the step after a good IPA.
          unzip -l dsh-go-unsigned.ipa | head -n 20 || true

    artifacts:
      - dsh-go-unsigned.ipa
      - build-logs/*.log

  prototype-ish-coexist:
    name: Prototype iSH coexist (NodeMobile + iSH, unsigned)
    instance_type: mac_mini_m2
    # 120 is provisional: the iSH Meson build + rootfs conversion have never
    # been timed on Codemagic. Measure the first run and tighten it after.
    # (The ios-unsigned workflow stays at 90; do not copy this number there.)
    max_build_duration: 120
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Check tools
        script: |
          set -euo pipefail
          mkdir -p build-logs-ish
          {
            echo "== versions =="
            xcodebuild -version
            flutter --version
            node --version
            python3 --version
            # NOTE: meson / ninja / brew llvm (clang + ld.lld) / libarchive
            # are NOT checked here on purpose. They are usually absent from
            # a fresh Codemagic mac_mini_m2 image, and build-ish.sh installs
            # any missing ones via brew and verifies them (including a VDSO
            # cross-link pre-check) before meson setup. Failing here would
            # only duplicate that logic and block the install step.
            echo "== required tools =="
            for t in rsync unzip zip tar curl shasum file ditto; do
              command -v "$t" >/dev/null || { echo "MISSING: $t"; exit 1; }
            done
            echo "== disk =="
            df -h "$PWD" | tail -1
          } 2>&1 | tee build-logs-ish/00-tools.log

      - name: Prepare NodeMobile (reuse prepare-ios.sh logic)
        script: |
          set -euo pipefail
          # Same pinned NodeMobile inputs as runtime/native-node/prepare-ios.sh
          # (version 24.20.0-0), but WITHOUT the DSH payload archive: the
          # stage-1 prototype only needs NodeMobile itself (it runs
          # `node -e "console.log('node ok')"`), not the full engine tree.
          # Staged to app/ios/NativeNodeArtifacts, the same location the
          # production flow uses — the prototype Xcode project must reference
          # that path (retarget here if the prototype owner moves it).
          version=24.20.0-0
          stage=engine-build/stage-ish-proto
          output=app/ios/NativeNodeArtifacts
          marker="$output/.nodemobile-manifest.json"
          if [ -f "$marker" ] \
             && [ -d "$output/NodeMobile.xcframework/ios-arm64/NodeMobile.framework" ] \
             && python3 -c "import json,sys; sys.exit(0 if json.load(open('$marker')).get('version')=='$version' else 1)"; then
            echo "NodeMobile $version already staged, skipping download"
            exit 0
          fi
          mkdir -p "$stage"
          curl --fail --location --retry 2 \
            "https://github.com/digidem/nodejs-mobile/releases/download/v$version/nodejs-mobile-ios-$version.zip" \
            -o "$stage/node-mobile.zip" 2>&1 | tee build-logs-ish/01-nodemobile-download.log
          printf '%s  %s\n' f97c5f368f5982fdc062b0f97d96d7696f94dbaf286fbd0d3c515b596088bca8 "$stage/node-mobile.zip" | shasum -a 256 -c -
          curl --fail --location --retry 2 \
            "https://raw.githubusercontent.com/digidem/nodejs-mobile/v$version/LICENSE" \
            -o "$stage/NodeMobile-LICENSE.txt"
          printf '%s  %s\n' c373dabed995013e091b1908996a69a1647ef19d400e6c1fd4b7fb06d8bc0f66 "$stage/NodeMobile-LICENSE.txt" | shasum -a 256 -c -
          unzip -q "$stage/node-mobile.zip" 'NodeMobile.xcframework/*' -d "$stage"
          mkdir -p "$output"
          rsync -a --delete "$stage/NodeMobile.xcframework/" "$output/NodeMobile.xcframework/"
          cp "$stage/NodeMobile-LICENSE.txt" "$output/NodeMobile-LICENSE.txt"
          python3 -c "import json; json.dump({'version': '$version', 'zip_sha256': 'f97c5f368f5982fdc062b0f97d96d7696f94dbaf286fbd0d3c515b596088bca8', 'license_sha256': 'c373dabed995013e091b1908996a69a1647ef19d400e6c1fd4b7fb06d8bc0f66'}, open('$marker', 'w'), indent=2)"
          test -d "$output/NodeMobile.xcframework/ios-arm64/NodeMobile.framework"
          echo "NodeMobile $version staged"

      - name: Build iSH libs
        script: |
          set -euo pipefail
          # Skip guard: rebuild only when the pinned iSH input changed.
          # build-ish.sh itself is idempotent (cached tarball, incremental
          # ninja), but this guard avoids even invoking it on re-runs.
          manifest=app/ios/IShArtifacts/ish-manifest.json
          pinned="$(python3 -c "import json; print(json.load(open('third_party/ish/source.json'))['commit'])")"
          if [ -f "$manifest" ] \
             && [ -f app/ios/IShArtifacts/lib/libish.a ] \
             && [ -f app/ios/IShArtifacts/lib/libish_emu.a ] \
             && [ -f app/ios/IShArtifacts/lib/libfakefs.a ] \
             && [ -f app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf ] \
             && python3 -c "import json,sys; sys.exit(0 if json.load(open('$manifest')).get('ish_commit')=='$pinned' else 1)"; then
            echo "iSH libs already built for commit $pinned, skipping rebuild"
            exit 0
          fi
          bash third_party/ish/build-ish.sh 2>&1 | tee build-logs-ish/02-build-ish.log
          # The script asserts the VDSO itself; re-assert here so the log
          # shows the check even on a skipped-then-rebuilt run.
          test -s app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf
          file app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf | grep -q "ELF"

      - name: Stage iSH artifacts (rootfs)
        script: |
          set -euo pipefail
          # prepare-rootfs.sh has its own manifest skip guard; this step
          # always runs it (cheap when skipped) and then verifies the
          # contract the prototype App depends on.
          bash third_party/ish/prepare-rootfs.sh 2>&1 | tee build-logs-ish/03-prepare-rootfs.log
          test -f app/ios/IShArtifacts/alpine-rootfs.zip
          test -f app/ios/IShArtifacts/rootfs-manifest.json
          test -f app/ios/IShArtifacts/lib/libish.a
          test -f app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf
          test -s app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf
          file app/ios/IShArtifacts/vdso/arm64/libvdso.so.elf | grep -q "ELF"
          echo "IShArtifacts OK:"
          du -sh app/ios/IShArtifacts
          python3 -c "import json; m=json.load(open('app/ios/IShArtifacts/rootfs-manifest.json')); print('rootfs zip SHA256:', m['rootfs_zip_sha256'])"
          python3 -c "import json; m=json.load(open('app/ios/IShArtifacts/ish-manifest.json')); print('ish commit:', m['ish_commit'], '| vdso SHA256:', m['vdso']['sha256'])"

      - name: Build prototype App (xcodebuild, no codesign)
        script: |
          set -euo pipefail
          # Prototype Xcode project lives in prototype/ISHCoexist/; scheme
          # name ISHCoexist is the contract with the prototype owner.
          # The .xcodeproj filename is discovered, not hardcoded.
          proj="$(ls -d prototype/ISHCoexist/*.xcodeproj 2>/dev/null | head -n 1 || true)"
          [ -n "$proj" ] || { echo "No .xcodeproj found under prototype/ISHCoexist/"; exit 1; }
          echo "Building $proj (scheme ISHCoexist)..."
          xcodebuild -project "$proj" -scheme ISHCoexist \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/ish-coexist-derived \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-logs-ish/04-xcodebuild.log
          # Locate the built .app without assuming its product name.
          app_path="$(find build/ish-coexist-derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          [ -n "$app_path" ] || { echo "No .app found in Release-iphoneos"; exit 1; }
          echo "$app_path" > build-logs-ish/app-path.txt
          echo "Built: $app_path"
          du -sh "$app_path"

      - name: Package prototype unsigned IPA
        script: |
          set -euo pipefail
          app_path="$(cat build-logs-ish/app-path.txt)"
          rm -rf Payload prototype-ish-coexist-unsigned.ipa
          mkdir -p Payload
          # ditto preserves the framework symlinks (needed for re-signing).
          ditto "$app_path" "Payload/$(basename "$app_path")"
          find Payload -name .DS_Store -delete || true
          # -y stores symlinks as links (do not dereference them).
          zip -r -y -X prototype-ish-coexist-unsigned.ipa Payload 2>&1 | tee build-logs-ish/05-package-ipa.log
          ls -lh prototype-ish-coexist-unsigned.ipa
          # NB: `unzip -l | head` exits 141 (SIGPIPE) under `pipefail` when
          # head closes early, which would fail the step after a good IPA.
          unzip -l prototype-ish-coexist-unsigned.ipa | head -n 20 || true

    artifacts:
      - prototype-ish-coexist-unsigned.ipa
      - build-logs-ish/*.log

  ios-aot-record:
    name: iOS AOT record (minimal set, unsigned)
    instance_type: mac_mini_m2
    # 120 is provisional: the recorder build + six recording runs + gen.py +
    # assembling have never been timed on Codemagic. Measure the first run
    # and tighten it after. The recording is only re-run when the images
    # need updating (new rootfs, new Alpine release, ish abi change).
    # Free-minutes note: this workflow burns real minutes (~30-60 expected).
    # Check the remaining free minutes before triggering it.
    max_build_duration: 120
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install recording deps
        script: |
          set -euo pipefail
          # Same brew set as the iSH lib build (llvm/ninja/libarchive/meson).
          # The recorder is a macOS CLI (host build); llvm is needed for the
          # VDSO check inside build-ish.sh's prerequisites, which
          # record-aot.sh does not call — but prepare-rootfs.sh needs
          # fakefsify, built from the ish source with the host meson build.
          # NOTE: this step MUST run before "Check tools": meson/ninja are
          # not pre-installed on the Codemagic image, so checking first
          # fails with "MISSING: meson" (build 6af89d00, 2026-11-15).
          for pkg in llvm lld ninja libarchive meson; do
            if brew list "$pkg" >/dev/null 2>&1; then
              echo "brew package present: $pkg"
            else
              echo "Installing brew package: $pkg ..."
              brew install "$pkg"
            fi
          done
          command -v meson >/dev/null || { echo "meson not found after brew install"; exit 1; }
          command -v ninja >/dev/null || { echo "ninja not found after brew install"; exit 1; }

      - name: Check tools
        script: |
          set -euo pipefail
          mkdir -p build-logs
          {
            echo "== versions =="
            xcodebuild -version
            python3 --version
            echo "== required tools =="
            for t in rsync unzip tar curl shasum zip ditto meson ninja openssl; do
              command -v "$t" >/dev/null || { echo "MISSING: $t"; exit 1; }
            done
            python3 -c "import tqdm" 2>/dev/null || pip3 install tqdm
            echo "== disk =="
            df -h "$PWD" | tail -1
          } 2>&1 | tee build-logs/00-tools.log

      - name: Record minimal AOT set
        script: |
          set -euo pipefail
          # Records musl, busybox, zlib, libcrypto, libssl, pcre2 on the
          # app's own rootfs, then assembles libish_aot.a via build-aot.sh.
          # macOS arm64 only (the JIT emits host-native code; the script
          # refuses to run on x86_64). All six modules must pass their
          # gates (dry run markers, translation floors); any failure stops
          # the workflow — a silent partial recording is how coverage gets
          # lost. See third_party/ish/record-aot.sh for the gates.
          bash third_party/ish/record-aot.sh 2>&1 | tee build-logs/01-record-aot.log
          echo "== recorded images =="
          ls -lh third_party/ish/aot/
          python3 third_party/ish/aot-tools/image_info.py third_party/ish/aot/
          echo "== staged archive =="
          ls -lh app/ios/IShArtifacts/lib/libish_aot.a
          cat app/ios/IShArtifacts/aot-manifest.json

    artifacts:
      - app/ios/IShArtifacts/lib/libish_aot.a
      - app/ios/IShArtifacts/aot-manifest.json
      - third_party/ish/aot/*.S
      - build-logs/*.log
